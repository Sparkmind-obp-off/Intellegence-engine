openapi: 3.1.0
info:
  title: Intelligence Engine API
  version: 0.1.0
  description: Draft contract for demand discovery and opportunity intelligence. Routes must be implemented and tested before release.
servers:
  - url: https://api.example.invalid
    description: Placeholder
security:
  - BearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness check
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
                  requestId: { type: string }
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: List non-sensitive enabled capabilities
      responses:
        '200':
          description: Capability list
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required: [name, enabled]
                      properties:
                        name: { type: string }
                        enabled: { type: boolean }
                        features:
                          type: array
                          items: { type: string }
  /v1/discovery/jobs:
    post:
      operationId: createDiscoveryJob
      summary: Create bounded discovery job
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, query, resultLimit, maxCost]
              properties:
                source: { type: string, example: apify }
                query: { type: string, minLength: 2, maxLength: 500 }
                niche: { type: string, maxLength: 120 }
                language: { type: string, maxLength: 16 }
                region: { type: string, maxLength: 80 }
                resultLimit: { type: integer, minimum: 1, maximum: 100 }
                maxCost: { type: number, minimum: 0, maximum: 5 }
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status]
                properties:
                  jobId: { type: string }
                  status: { type: string, enum: [queued, validating] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/discovery/jobs/{jobId}:
    get:
      operationId: getDiscoveryJob
      summary: Get workspace-scoped job status
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status]
                properties:
                  jobId: { type: string }
                  status: { type: string, enum: [queued, validating, running, normalizing, completed, partial, failed, cancelled] }
                  resultCount: { type: integer, minimum: 0 }
                  errorCode: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/signals:
    get:
      operationId: listDemandSignals
      summary: List normalized signals
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: niche
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Signal page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, type, summary, evidenceCount]
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [pain, question, workaround, buying_intent, dissatisfaction, trend] }
                        summary: { type: string }
                        confidence: { type: number, minimum: 0, maximum: 1 }
                        evidenceCount: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/opportunities:
    get:
      operationId: listOpportunities
      summary: List scored opportunity candidates
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: status
          schema: { type: string, enum: [draft, needs_review, validated, rejected, archived] }
      responses:
        '200':
          description: Opportunity page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, score, scoreVersion, status]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        summary: { type: string }
                        score: { type: integer, minimum: 0, maximum: 100 }
                        scoreVersion: { type: string }
                        confidence: { type: number, minimum: 0, maximum: 1 }
                        status: { type: string, enum: [draft, needs_review, validated, rejected, archived] }
                  nextCursor: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/opportunities/{opportunityId}/reviews:
    post:
      operationId: reviewOpportunity
      summary: Record human review
      parameters:
        - in: path
          name: opportunityId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, rationale]
              properties:
                decision: { type: string, enum: [validate, reject, needs_more_evidence] }
                rationale: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '201': { description: Review recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found in workspace
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Rate or budget limit reached
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
